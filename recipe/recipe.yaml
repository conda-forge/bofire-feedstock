schema_version: 1

context:
  name: bofire
  version: "0.4.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bofire-${{ version }}.tar.gz
  sha256: 57353777711d28de5c0f6665e02e10f3a4ece3d7b656c29da59b7ba186588c6d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - wheel
    - pip
  run:
    - formulaic <=1.0.2
    - typing_extensions
    - python >=${{ python_min }}
    - numpy
    - pandas
    - pydantic >=2.5
    - scipy >=1.7
tests:
  - python:
      imports:
        - bofire
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Experimental design and (multi-objective) bayesian optimization.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/experimental-design/bofire

extra:
  recipe-maintainers:
    - jan-janssen
